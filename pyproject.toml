[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airo-ipc"
version = "1.0.0"
authors = [
    { name = "Matthijs Biondina", email = "matthijs.biondina@ugent.be" },
    { name = "Mathieu De Coster", email = "mathieu.decoster@ugent.be" },
]
description = "IPC framework for AIRO."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "eclipse-zenoh>=1.7.2",
    "iceoryx2>=0.8.1",
    "loguru>=0.7.2",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/airo-ugent/airo-ipc"
Issues = "https://github.com/airo-ugent/airo-ipc/issues"

[tools.setuptools]
packages = ["airo_ipc"]

[dependency-groups]
benchmark = [
    "eclipse-zenoh>=1.7.2",
    "matplotlib>=3.9.4",
    "psutil>=7.2.2",
]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
]
